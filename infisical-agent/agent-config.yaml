# Infisical Agent config for openchamber
# 2026-09-03 (ai-pipeline consolidation): renders only the 3 keys openchamber
# needs (filter chain) from ai-pipeline / prod into /run/secrets/active.env.
# active.env lives on a shared tmpfs volume (see docker-compose.yml).
# CLI v0.43.128; the `secret` function returns a list, iterate with `range`.
infisical:
  # 2026-10-12: endereco interno em vez do tailnet. O tailscale 1.104.1 prende
  # os listeners do `serve` a interface tailscale0 (SO_BINDTODEVICE), logo o
  # :8437 e inalcancavel de uma bridge do Docker -- era isto que punha o
  # openchamber e o proxy em ciclo de reinicio. O Infisical esta na mesma rede.
  # Valor anterior, para reverter:
  #address: "https://pipeline-vps-new.tailbbccd8.ts.net:8437/api"
  address: "http://infisical:8080/api"
  retry-strategy:
    max-retries: 5
    max-delay: "10s"
    base-delay: "500ms"

auth:
  type: universal-auth
  config:
    client-id: /run/secrets/infisical/client-id
    client-secret: /run/secrets/infisical/client-secret

templates:
  - template-content: |
      {{- with secret "bdec46df-92ea-43ca-8cd3-3607add4205b" "prod" "/" -}}
      {{- range . -}}
      {{- if or (eq .Key "OPENCHAMBER_UI_PASSWORD") (eq .Key "TELEGRAM_BOT_TOKEN_GUARDIAN") (eq .Key "TELEGRAM_USER_ID") (eq .Key "GITHUB_TOKEN_OPENCHAMBER") -}}
      {{ .Key }}={{ .Value }}
      {{ end -}}
      {{- end -}}
      {{- end -}}
    destination-path: /run/secrets/active.env
    config:
      polling-interval: 60s