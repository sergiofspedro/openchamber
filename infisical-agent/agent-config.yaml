# Infisical Agent config for openchamber
# Renders secrets from /openchamber/ path as dotenv to /run/secrets/active.env
# (per INFISICAL-STACK-20260902.md, the openchamber project uses path /openchamber/,
#  not /). Restart of openchamber container picks up changes automatically.
# CLI v0.43.128 expects: source-path OR template-content + destination-path
# + config.polling-interval. The function is `secret` (not listSecrets).
infisical:
  address: "https://pipeline-vps-new.tailbbccd8.ts.net:8437/api"
  retry-strategy:
    max-retries: 5
    max-delay: "10s"
    base-delay: "500ms"

auth:
  type: universal-auth
  config:
    client-id: /run/secrets/infisical/client-id
    client-secret: /run/secrets/infisical/client-secret

templates:
  - template-content: |
      {{- with secret "98137933-832d-4f27-a1c6-7fc5e61f843a" "prod" "/openchamber" }}
      {{- range . }}
      {{ .Key }}={{ .Value }}
      {{- end }}
      {{- end }}
    destination-path: /run/secrets/active.env
    config:
      polling-interval: 60s
