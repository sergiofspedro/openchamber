services:
  openchamber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openchamber
    # 2026-08-31: sem isto o PID 1 e a propria aplicacao e nao recolhe filhos
    # orfaos. Mediram-se 713 zombies, 325 deles com este container como pai.
    init: true
    # 2026-08-31: run web server as foreground process so Docker's init reaps
    # children and restarts on crash. Without this, the entrypoint falls back
    # to "cli.js logs" (a log tailer) which does NOT serve HTTP — port 3000
    # goes dark and Tailscale serve returns 502.
    # 2026-09-03 (B1): sh wrapper sources /run/secrets/active.env (Infisical sidecar
    # output) so TELEGRAM_BOT_TOKEN_GUARDIAN + TELEGRAM_USER_ID are visible to bun.
    # set -a exports every var assigned; set +a reverts. `exec` replaces sh with
    # bun so signals (SIGTERM) reach the openchamber process directly.
    command:
      - sh
      - -c
      - |
        set -a
        . /run/secrets/active.env
        set +a
        exec bun packages/web/bin/cli.js serve --port 3000 --foreground --host 0.0.0.0
    ports:
      - "127.0.0.1:3010:3000"
      # Plannotator annotation UI (remote mode, 2026-08-21)
      - "100.95.67.86:19432:19432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/openchamber:/home/openchamber/.config/openchamber
      - ./data/opencode/share:/home/openchamber/.local/share/opencode
      # Persist opencode runtime logs (incl. magic-context.log) across restarts (2026-08-21)
      - ./data/opencode/state:/home/openchamber/.local/state/opencode
      - ./data/opencode/config:/home/openchamber/.config/opencode
      # magic-context keeps its config here and its memory DB in .local/share.
      # Both must be mounted or every container recreate wipes the memory.
      - ./data/cortexkit/config:/home/openchamber/.config/cortexkit
      - ./data/cortexkit/share:/home/openchamber/.local/share/cortexkit
      - ./data/opencode/omo:/home/openchamber/.omo
      - ./data/ssh:/home/openchamber/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/opencode/tmp:/tmp/opencode
      - ./workspaces:/home/openchamber/workspaces
      # The docs repo, at the same path as on the host so absolute paths in
      # memory/vps/** and in the skills resolve identically inside and out.
      # Without this the container cannot read OPENCODE-HANDOFF.md at all,
      # and ssh from container to host is refused (publickey).
      - /home/pipeline/pipeline/github/Claude:/home/pipeline/pipeline/github/Claude
      - /home/pipeline/.openclaw/personal-context-vault:/home/openchamber/workspaces/obsidian-vault
      - ./data/gitconfig:/home/openchamber/.gitconfig
      - /run/user/1000/openclaw-secrets:/run/secrets:ro
      # 2026-09-03 (tmpfs hardening): shared in-memory volume (tmpfs, 1 MiB)
      # with the infisical-agent sidecar. The sidecar writes active.env to it;
      # this service reads it. active.env lives ONLY in RAM — no host-disk
      # presence, no rest-at-rest on the filesystem.
      - openchamber_run-secrets:/run/secrets:ro
    # 2026-09-03: secrets from Infisical are rendered by the infisical-agent
    # sidecar to /run/secrets/active.env (60s polling). Compose's `env_file`
    # does NOT work here because paths are evaluated on the host at parse time,
    # and the file only exists inside the container after the sidecar writes
    # it. Workaround: wrap the command in sh -c to source the file before exec.
    # depends_on still gates startup on the sidecar's healthcheck.
    depends_on:
      infisical-agent:
        condition: service_healthy
    environment:
      # Autenticacao da UI desligada em 2026-08-31, por decisao do dono, depois de o
      # login ficar impossivel: na versao 1.22.0 o proprio `POST /api/auth/login`
      # responde `401 Authentication required` -- exige autenticacao para autenticar.
      # A UI carregava e ficava presa no ecra de carregamento, igual em janela normal
      # e privada, porque nunca conseguia passar do 401.
      #
      # CORRECCAO a uma leitura minha errada, no mesmo dia: eu tinha escrito aqui que
      # o bind 0.0.0.0 "ja nao era verdade" por ver `127.0.0.1:3010` no anfitriao.
      # Sao coisas diferentes: a app liga a 0.0.0.0 DENTRO do container, e e o Docker
      # que so a expoe em 127.0.0.1. Ao remover a password o container entrou em ciclo
      # de reinicio com "OpenChamber refuses to bind to 0.0.0.0 without UI
      # authentication". A variavel abaixo e a valvula que os proprios autores preveem.
      #
      # Porque e aceitavel aqui, medido a 2026-08-31:
      #   3010  -> 127.0.0.1 apenas no anfitriao (nao ha escuta em 0.0.0.0)
      #   19432 -> 100.95.67.86 (Tailscale)
      #   148.230.116.248:3010 -> sem resposta pela internet publica
      # O acesso chega so pelo `tailscale serve`, que e "tailnet only": a LAN a que a
      # app se expoe e a rede interna do container, nao a Internet.
      #
      # Para repor a password quando o bug do login estiver corrigido a montante:
      # apagar a linha ALLOW_UNAUTHENTICATED_LAN e descomentar esta:
      #   OPENCHAMBER_UI_PASSWORD: ${OPENCHAMBER_UI_PASSWORD:-}
      OPENCHAMBER_ALLOW_UNAUTHENTICATED_LAN: "true"
      # TELEGRAM_BOT_TOKEN_GUARDIAN + TELEGRAM_USER_ID are now injected by the
      # infisical-agent sidecar (B1 migration, 2026-09-03) via /run/secrets/active.env.
      # See `infisical-agent` service below. Plaintext .env no longer needs them.
      OPENCODE_ENABLE_EXA: "1"
      # FlowDeck injecta um pacote proprio de servidores MCP e sobrepoe-se ao
      # opencode.jsonc: faz `Object.assign(cfg.mcp, mcps)`, sem preservar o que ja
      # la estava. Seis destes falhavam a cada sessao (visivel como "server
      # unavailable" no opencode.log). O playwright dele pedia --browser chrome,
      # que nao esta instalado aqui, e sem --headless num container sem display.
      # Desligado, a definicao local (binario headless + chromium) sobrevive.
      # Ficam de fora context7 e websearch, que funcionam.
      FLOWDECK_DISABLE_MCP: "playwright,memory,sequential-thinking,magic,token-optimizer,github"
      # Ceiling for model output tokens (2026-08-20, mirror of local). Default engine value
      # is 32000; 8000 caps runaway long outputs without breaking multi-step tool calls.
      # Ceiling for model output tokens (2026-08-20, mirror of local). Default engine
      # value is 32000; 8000 caps runaway long outputs without breaking multi-step
      # tool calls. NAO subir por causa do historian: o limite dele vive em
      # magic-context.jsonc como historian.maxTokens (verificado na documentacao
      # do cortexkit a 2026-08-27).
      OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: "8000"
      # Plannotator remote mode (fixed port, 2026-08-21)
      PLANNOTATOR_REMOTE: "1"
      PLANNOTATOR_PORT: "19432"
      OMO_QUESTION_TIMEOUT_MS: "600000"
      # Wall-clock ceiling for ONE continuous unattended stretch (6h), after which the
      # agent is told to stop and write a report, and Gio gets a Telegram. Replaces the
      # loop-guard token ceiling removed 2026-08-18: a cumulative token cap cannot tell a
      # runaway from a session that simply lives a long time, and these sessions are meant
      # to live for months. Only read when OMO_QUESTION_TIMEOUT_MS > 0, i.e. here.
      OMO_UNATTENDED_DEADLINE_MS: "21600000"
      # 2026-09-18: open-mem sem chave de API cria uma sessao unica '[open-mem] AI compression' no agente por
      # defeito (orchestrator, todas as tools) e alimenta-a com cada saida de tool: 24% dos tokens do VPS numa
      # semana, e chegou a agir como trabalhador autonomo. Precedencia do plugin: defaults < .open-mem/config.json
      # do projeto < variaveis OPEN_MEM_*. Os config.json vivem na camada do contentor (perdem-se num recreate);
      # estas variaveis nao. Mantem as tools mem-* e a injecao de contexto. Ver notes/VPS-OPEN-MEM-20260918.md
      OPEN_MEM_COMPRESSION: "false"
      OPEN_MEM_FOLDER_CONTEXT: "false"
      OPEN_MEM_IGNORED_TOOLS: "bash,read,glob,grep,fdx-ls,fdx-read,fdx-grep,fdx-git,pty_read,pty_spawn,pty_kill,task,encode,invalid"
    # OPENCHAMBER_HOST: 0.0.0.0  # Bind address (default in Docker entrypoint: 0.0.0.0)
    # OPENCHAMBER_TUNNEL_PROVIDER: cloudflare
    # OPENCHAMBER_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # OPENCHAMBER_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # OPENCHAMBER_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # OPENCHAMBER_TUNNEL_CONFIG: /home/openchamber/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    # OPENCHAMBER_OPENCODE_HOSTNAME: 0.0.0.0 # Bind OpenCode to all interfaces
    group_add:
      - "988"
    restart: unless-stopped
    # 2026-10-02: sonda o MOTOR, nao o servidor web. O `/health` do servidor
    # responde 200 COM O MOTOR MORTO -- foi assim que o auto-dispatch esteve 5
    # dias sem despachar nada (2026-09-26 a 10-01) e nada avisou. O
    # `/api/health`, que diria a verdade, exige autenticacao (401), logo um
    # healthcheck nao o pode usar.
    #
    # O script procura a porta do motor e espera um 401 sem credenciais: um 401
    # prova processo + escuta + autenticacao de uma vez, e nao precisa de
    # segredo nenhum. Vive no bind mount `data/opencode/config/scripts/`.
    #
    # interval 60s + retries 5 = cinco falhas seguidas antes de unhealthy. O
    # servidor tem auto-cura propria do motor e durante o respawn nao ha porta;
    # um respawn normal nao chega a cinco, o motor morto com a auto-cura
    # encravada chega. start_period conservador: nao tenho medicao do arranque
    # a frio, e prefiro esperar de mais a declarar unhealthy quem ainda sobe.
    healthcheck:
      test: ["CMD", "bash", "/home/openchamber/.config/opencode/scripts/healthcheck-motor.sh"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 300s
    mem_limit: 10g  # 8->10g 2026-08-29: o pre-voo passa a medir o cgroup
    # 2026-09-12: 3 dos 4 vCPU. Nenhum container tinha tecto de CPU e o
    # `opencode serve` daqui de dentro levou a maquina a load 8,7, o que fez o
    # New API recusar TODAS as cadeias com `system cpu overloaded`. Tecto alto de
    # proposito -- consome 1,18 -- mas deixa sempre um nucleo para os outros 37.
    cpus: 3.0
    # 2 GiB de swap, nao os 12g que o Docker assumia por omissao (2x mem_limit).
    # Com 6 GiB de swap o container sozinho enchia os 8 GiB do host: 2026-08-23,
    # load average 46 por thrashing. Um pico transitorio cabe; um vazamento nao.
    memswap_limit: 10g
    mem_reservation: 4g
    oom_score_adj: "-500"
    pids_limit: 2048
    networks:
      - pipeline-net
      - infra-intel-internal

  # 2026-09-03: Infisical Agent sidecar (B1 migration). Renders
  # vps-shared/98137933/prod/openchamber/active secrets to
  # /run/secrets/active.env (bind-mounted to openchamber service above).
  # Same pattern as dashboard-b2b-infisical-agent. Requires Universal Auth
  # identity `openchamber-infisical-agent` with read access to vps-shared
  # project — see openchamber-scratch/B1-OWNER-ACTION-20260903.md for the
  # 3-step setup the owner must run in the Infisical UI.
  infisical-agent:
    # 2026-09-12: tecto de memoria. Nenhum destes containers tinha um,
    # e um vazamento levava a maquina inteira em vez de ser abatido.
    mem_limit: 494m
    memswap_limit: 988m
    build:
      context: ./infisical-agent
      dockerfile: Dockerfile
    image: openchamber/infisical-agent:latest # custom build — no upstream tag
    container_name: openchamber-infisical-agent
    restart: unless-stopped
    command: ["agent", "--config", "/config/agent-config.yaml"]
    volumes:
      # 2026-09-03 (tmpfs hardening): write active.env to the shared tmpfs
      # volume, NOT to a host bind mount. active.env lives only in RAM.
      - openchamber_run-secrets:/run/secrets
      - ./infisical-agent/agent-config.yaml:/config/agent-config.yaml:ro
      - /home/pipeline/pipeline/docker/infisical-agent-secrets/openchamber.client-id:/run/secrets/infisical/client-id:ro
      - /home/pipeline/pipeline/docker/infisical-agent-secrets/openchamber.client-secret:/run/secrets/infisical/client-secret:ro
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/secrets/active.env"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    user: "0:0"

networks:
  pipeline-net:
    external: true
    name: infisical_pipeline-net

  # 2026-09-12 (Phase 4): internal observability network hosting infra-intel-toise
  # (Toise MCP at http://infra-intel-toise:8080/mcp). Declared external so the
  # openchamber service can join it without compose owning its lifecycle.
  infra-intel-internal:
    external: true
    name: infra-intel-internal

# 2026-09-03 (tmpfs hardening): shared in-memory volume (tmpfs, 1 MiB) between
# the infisical-agent sidecar and the main openchamber service. Both mount it
# at /run/secrets; the sidecar writes active.env, the main service reads it.
# Pre-create the volume before `docker compose up`:
#   docker volume create --driver local --opt type=tmpfs --opt device=tmpfs \
#     --opt o=size=1m openchamber_run-secrets
# active.env is gone on Docker daemon restart (tmpfs is RAM); the sidecar will
# re-poll and re-write within 60s of restart.
volumes:
  openchamber_run-secrets:
    external: true